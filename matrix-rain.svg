<svg xmlns="http://www.w3.org/2000/svg" width="920" height="190" viewBox="0 0 920 190">
  <rect width="920" height="190" fill="#0d1117"/>

  <!-- Matrix rain columns (SMIL animation) -->
  <g font-family="monospace" font-size="15" fill="#FF6A00">
    <text x="50" y="0">
      1 0 1 0 1
      <animate attributeName="y" values="-20;200" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1;1" dur="2.2s" repeatCount="indefinite"/>
    </text>
    <text x="160" y="0">
      0 1 1 0 1
      <animate attributeName="y" values="-20;200" dur="2.6s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1;1" dur="2.6s" begin="0.4s" repeatCount="indefinite"/>
    </text>
    <text x="270" y="0">
      1 1 0 1 0
      <animate attributeName="y" values="-20;200" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1;1" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    </text>
    <text x="380" y="0">
      0 1 0 1 1
      <animate attributeName="y" values="-20;200" dur="2.8s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1;1" dur="2.8s" begin="1.2s" repeatCount="indefinite"/>
    </text>
    <text x="490" y="0">
      1 0 1 1 0
      <animate attributeName="y" values="-20;200" dur="2.5s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1;1" dur="2.5s" begin="1.6s" repeatCount="indefinite"/>
    </text>
  </g>

  <g font-family="monospace" font-size="15" fill="#FFB347">
    <text x="600" y="0">
      0 1 0 0 1
      <animate attributeName="y" values="-20;200" dur="2.6s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1;1" dur="2.6s" begin="0.6s" repeatCount="indefinite"/>
    </text>
    <text x="710" y="0">
      1 1 1 0 0
      <animate attributeName="y" values="-20;200" dur="2.2s" begin="0.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1;1" dur="2.2s" begin="0.2s" repeatCount="indefinite"/>
    </text>
    <text x="820" y="0">
      0 0 1 1 0
      <animate attributeName="y" values="-20;200" dur="2.8s" begin="1.0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1;1" dur="2.8s" begin="1.0s" repeatCount="indefinite"/>
    </text>
  </g>

</svg>
