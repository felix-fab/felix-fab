<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250">
  <!-- Editor frame -->
  <rect x="10" y="10" width="740" height="230" rx="10" fill="#0d1117" stroke="#FF6A00" stroke-width="1.5"/>
  <text x="30" y="42" font-family="monospace" font-size="14" fill="#8b949e">main.py</text>
  <rect x="88" y="28" width="18" height="18" rx="3" fill="#FF6A00"/>
  <text x="91" y="42" fill="#0d1117" font-size="12" font-family="monospace">▶</text>

  <!-- Line numbers -->
  <g font-family="monospace" font-size="15" fill="#3d444d">
    <text x="30" y="80">1</text>
    <text x="30" y="107">2</text>
    <text x="30" y="134">3</text>
    <text x="30" y="161">4</text>
    <text x="30" y="188">5</text>
    <text x="30" y="215">6</text>
  </g>

  <!-- Line 1: import socket -->
  <g font-family="monospace" font-size="15">
    <text x="60" y="80" fill="#ff7b72">import</text>
    <text x="130" y="80" fill="#79c0ff">socket</text>
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.08;1" dur="8s" repeatCount="indefinite"/>
  </g>

  <!-- Line 2: def scan(host, port): -->
  <g font-family="monospace" font-size="15">
    <text x="60" y="107" fill="#ff7b72">def</text>
    <text x="105" y="107" fill="#d2a8ff">scan</text>
    <text x="165" y="107" fill="#ffa657">(host, port)</text>
    <text x="290" y="107" fill="#ff7b72">:</text>
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.22;1" dur="8s" begin="0.6s" repeatCount="indefinite"/>
  </g>

  <!-- Line 3: try: -->
  <g font-family="monospace" font-size="15">
    <text x="85" y="134" fill="#ff7b72">try</text>
    <text x="105" y="134" fill="#ff7b72">:</text>
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.36;1" dur="8s" begin="1.2s" repeatCount="indefinite"/>
  </g>

  <!-- Line 4: s = socket() -->
  <g font-family="monospace" font-size="15">
    <text x="110" y="161" fill="#79c0ff">s</text>
    <text x="125" y="161" fill="#ff7b72">=</text>
    <text x="140" y="161" fill="#79c0ff">socket</text>
    <text x="205" y="161" fill="#ffa657">()</text>
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.5;1" dur="8s" begin="1.8s" repeatCount="indefinite"/>
  </g>

  <!-- Line 5: s.connect((host, port)) -->
  <g font-family="monospace" font-size="15">
    <text x="110" y="188" fill="#79c0ff">s</text>
    <text x="125" y="188" fill="#ffa657">.connect</text>
    <text x="215" y="188" fill="#ffa657">((host, port))</text>
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.64;1" dur="8s" begin="2.4s" repeatCount="indefinite"/>
  </g>

  <!-- Line 6: return True -->
  <g font-family="monospace" font-size="15">
    <text x="110" y="215" fill="#ff7b72">return</text>
    <text x="185" y="215" fill="#79c0ff">True</text>
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.78;1" dur="8s" begin="3s" repeatCount="indefinite"/>
  </g>

  <!-- Blinking cursor -->
  <text x="360" y="215" font-family="monospace" font-size="15" fill="#FF6A00">▌
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </text>
</svg>
