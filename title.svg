<svg xmlns="http://www.w3.org/2000/svg" width="920" height="230" viewBox="0 0 920 230">
  <!-- Outer glow frame -->
  <rect x="8" y="8" width="904" height="214" rx="14" fill="#0d1117" stroke="#FF6A00" stroke-width="2"/>
  <rect x="11" y="11" width="898" height="208" rx="11" fill="none" stroke="#FFB347" stroke-width="1" opacity="0.35"/>

  <!-- Title bar -->
  <rect x="10" y="10" width="900" height="36" rx="10" fill="#161b22"/>
  <circle cx="34" cy="28" r="6" fill="#ff5f56"/>
  <circle cx="54" cy="28" r="6" fill="#ffbd2e"/>
  <circle cx="74" cy="28" r="6" fill="#27c93f"/>
  <text x="460" y="33" text-anchor="middle" font-family="monospace" font-size="13" fill="#8b949e">felix@kali — ~/profile</text>

  <!-- Terminal prompt lines -->
  <text x="60" y="80" font-family="monospace" font-size="15" fill="#00e676">$</text>
  <text x="85" y="80" font-family="monospace" font-size="15" fill="#FFB347">whoami</text>

  <text x="60" y="150" font-family="monospace" font-size="15" fill="#00e676">$</text>
  <text x="85" y="150" font-family="monospace" font-size="15" fill="#FFB347">id</text>

  <!-- Output: FELIX big -->
  <text x="85" y="112" font-family="monospace" font-size="34" font-weight="bold" fill="#FF6A00">FELIX</text>

  <!-- Output roles -->
  <text x="85" y="180" font-family="monospace" font-size="15" fill="#FFB347">uid=0(root) gid=0(root)</text>
  <text x="85" y="202" font-family="monospace" font-size="14" fill="#FF8C00">role=software developer, penetration tester</text>
</svg>
